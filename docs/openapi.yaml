openapi: 3.0.3
info:
  title: 'VERGEL API Documentation'
  description: 'API REST de VERGEL para la gestión de clientes, suscripciones, servicios, cotizaciones, billeteras y puntos de lealtad. Operaciones orientadas a El Salvador (DTE, DUI, NRC, IVA).'
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
tags:
  -
    name: Clientes
    description: ''
  -
    name: 'Planes de Suscripción'
    description: ''
  -
    name: Empleados
    description: ''
  -
    name: Roles
    description: ''
  -
    name: Autenticación
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Los tokens se generan mediante Laravel Sanctum. Para obtener tu token, inicia sesión en la aplicación y emite un nuevo token de acceso.'
security:
  -
    default: []
paths:
  /api/v1/customers:
    get:
      summary: 'Listar y filtrar clientes.'
      operationId: listarYFiltrarClientes
      description: 'Obtiene una lista paginada de clientes con opciones de búsqueda y filtros.'
      parameters:
        -
          in: query
          name: search
          description: 'Busca por nombre legal, nombre comercial, correo, teléfono, NIT o NRC.'
          example: architecto
          required: false
          schema:
            type: string
            description: 'Busca por nombre legal, nombre comercial, correo, teléfono, NIT o NRC.'
            example: architecto
        -
          in: query
          name: status
          description: 'Filtrar por estado.'
          example: active
          required: false
          schema:
            type: string
            description: 'Filtrar por estado.'
            example: active
        -
          in: query
          name: phone
          description: 'Filtrar por teléfono (coincidencia parcial).'
          example: architecto
          required: false
          schema:
            type: string
            description: 'Filtrar por teléfono (coincidencia parcial).'
            example: architecto
        -
          in: query
          name: desde
          description: 'date Filtrar por fecha de creación desde (YYYY-MM-DD).'
          example: architecto
          required: false
          schema:
            type: string
            description: 'date Filtrar por fecha de creación desde (YYYY-MM-DD).'
            example: architecto
        -
          in: query
          name: hasta
          description: 'date Filtrar por fecha de creación hasta (YYYY-MM-DD).'
          example: architecto
          required: false
          schema:
            type: string
            description: 'date Filtrar por fecha de creación hasta (YYYY-MM-DD).'
            example: architecto
        -
          in: query
          name: limit
          description: 'Cantidad de resultados por página.'
          example: 15
          required: false
          schema:
            type: integer
            description: 'Cantidad de resultados por página.'
            example: 15
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      legalName: 'Cliente Ejemplo S.A. de C.V.'
                      tradeName: 'Cliente Ejemplo'
                      taxId: 0614-260290-101-1
                      nrc: 123456-7
                      phone: 7000-0000
                      status: active
                      currentPlanName: 'Plan Básico'
                      cashBalance: 250.5
                      loyaltyPoints: 120
                      createdAt: '2026-09-23T06:00:00+00:00'
                  links:
                    first: 'http://localhost/api/v1/customers?page=1'
                    last: 'http://localhost/api/v1/customers?page=1'
                    prev: null
                    next: null
                  meta:
                    current_page: 1
                    from: 1
                    last_page: 1
                    path: 'http://localhost/api/v1/customers'
                    per_page: 15
                    to: 1
                    total: 1
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        legalName: 'Cliente Ejemplo S.A. de C.V.'
                        tradeName: 'Cliente Ejemplo'
                        taxId: 0614-260290-101-1
                        nrc: 123456-7
                        phone: 7000-0000
                        status: active
                        currentPlanName: 'Plan Básico'
                        cashBalance: 250.5
                        loyaltyPoints: 120
                        createdAt: '2026-09-23T06:00:00+00:00'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        legalName:
                          type: string
                          example: 'Cliente Ejemplo S.A. de C.V.'
                        tradeName:
                          type: string
                          example: 'Cliente Ejemplo'
                        taxId:
                          type: string
                          example: 0614-260290-101-1
                        nrc:
                          type: string
                          example: 123456-7
                        phone:
                          type: string
                          example: 7000-0000
                        status:
                          type: string
                          example: active
                        currentPlanName:
                          type: string
                          example: 'Plan Básico'
                        cashBalance:
                          type: number
                          example: 250.5
                        loyaltyPoints:
                          type: integer
                          example: 120
                        createdAt:
                          type: string
                          example: '2026-09-23T06:00:00+00:00'
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: 'http://localhost/api/v1/customers?page=1'
                      last:
                        type: string
                        example: 'http://localhost/api/v1/customers?page=1'
                      prev:
                        type: string
                        example: null
                        nullable: true
                      next:
                        type: string
                        example: null
                        nullable: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      from:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 1
                      path:
                        type: string
                        example: 'http://localhost/api/v1/customers'
                      per_page:
                        type: integer
                        example: 15
                      to:
                        type: integer
                        example: 1
                      total:
                        type: integer
                        example: 1
      tags:
        - Clientes
    post:
      summary: 'Registrar un nuevo cliente.'
      operationId: registrarUnNuevoCliente
      description: 'Crea un cliente y, como parte del proceso, inicializa su wallet y sus puntos de lealtad.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    legalName: 'Cliente Ejemplo S.A. de C.V.'
                    tradeName: 'Cliente Ejemplo'
                    taxId: 0614-260290-101-1
                    nrc: 123456-7
                    economicActivity: 'Venta de servicios'
                    address: 'Colonia Centro, San Salvador'
                    municipality: 'San Salvador'
                    department: 'San Salvador'
                    phone: 7000-0000
                    email: cliente@example.com
                    status: active
                    visitFrequency: null
                    currentPlan: null
                    wallet:
                      cashBalance: 0
                      reservedSubscriptionBalance: 0
                    loyaltyPoints: null
                    createdAt: '2026-09-23T06:00:00+00:00'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      legalName:
                        type: string
                        example: 'Cliente Ejemplo S.A. de C.V.'
                      tradeName:
                        type: string
                        example: 'Cliente Ejemplo'
                      taxId:
                        type: string
                        example: 0614-260290-101-1
                      nrc:
                        type: string
                        example: 123456-7
                      economicActivity:
                        type: string
                        example: 'Venta de servicios'
                      address:
                        type: string
                        example: 'Colonia Centro, San Salvador'
                      municipality:
                        type: string
                        example: 'San Salvador'
                      department:
                        type: string
                        example: 'San Salvador'
                      phone:
                        type: string
                        example: 7000-0000
                      email:
                        type: string
                        example: cliente@example.com
                      status:
                        type: string
                        example: active
                      visitFrequency:
                        type: string
                        example: null
                        nullable: true
                      currentPlan:
                        type: string
                        example: null
                        nullable: true
                      wallet:
                        type: object
                        properties:
                          cashBalance:
                            type: integer
                            example: 0
                          reservedSubscriptionBalance:
                            type: integer
                            example: 0
                      loyaltyPoints:
                        type: string
                        example: null
                        nullable: true
                      createdAt:
                        type: string
                        example: '2026-09-23T06:00:00+00:00'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The legal name field is required.'
                  errors:
                    legal_name:
                      - 'The legal name field is required.'
                properties:
                  message:
                    type: string
                    example: 'The legal name field is required.'
                  errors:
                    type: object
                    properties:
                      legal_name:
                        type: array
                        example:
                          - 'The legal name field is required.'
                        items:
                          type: string
      tags:
        - Clientes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                legal_name:
                  type: string
                  description: 'Nombre legal del cliente.'
                  example: 'Cliente Ejemplo S.A. de C.V.'
                trade_name:
                  type: string
                  description: 'Nombre comercial.'
                  example: 'Cliente Ejemplo'
                  nullable: true
                tax_id:
                  type: string
                  description: 'NIT del cliente (único).'
                  example: 0614-260290-101-1
                  nullable: true
                nrc:
                  type: string
                  description: 'NRC del cliente (único).'
                  example: 123456-7
                  nullable: true
                economic_activity:
                  type: string
                  description: 'Actividad económica.'
                  example: 'Venta de servicios'
                  nullable: true
                address:
                  type: string
                  description: Dirección.
                  example: 'Colonia Centro, San Salvador'
                department:
                  type: string
                  description: Departamento.
                  example: 'San Salvador'
                  nullable: true
                municipality:
                  type: string
                  description: Municipio.
                  example: 'San Salvador'
                phone:
                  type: string
                  description: 'Teléfono (único).'
                  example: 7000-0000
                email:
                  type: string
                  description: 'Correo electrónico.'
                  example: cliente@example.com
                  nullable: true
                visit_frequency_value:
                  type: integer
                  description: 'Frecuencia de visita (valor numérico).'
                  example: 30
                  nullable: true
                visit_frequency_unit:
                  type: string
                  description: 'Unidad de frecuencia de visita.'
                  example: days
                  nullable: true
                current_plan_id:
                  type: integer
                  description: 'ID del plan de suscripción inicial.'
                  example: 1
                  nullable: true
              required:
                - legal_name
                - address
                - municipality
                - phone
  '/api/v1/customers/{id}':
    get:
      summary: 'Obtener detalle completo de un cliente.'
      operationId: obtenerDetalleCompletoDeUnCliente
      description: 'Incluye el plan actual, la wallet y los puntos de lealtad del cliente.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    legalName: 'Cliente Ejemplo S.A. de C.V.'
                    tradeName: 'Cliente Ejemplo'
                    taxId: 0614-260290-101-1
                    nrc: 123456-7
                    economicActivity: 'Venta de servicios'
                    address: 'Colonia Centro, San Salvador'
                    municipality: 'San Salvador'
                    department: 'San Salvador'
                    phone: 7000-0000
                    email: cliente@example.com
                    status: active
                    visitFrequency:
                      value: 30
                      unit: days
                    currentPlan:
                      id: 1
                      planCode: BASICO
                      planName: 'Plan Básico'
                    wallet:
                      cashBalance: 250.5
                      reservedSubscriptionBalance: 0
                    loyaltyPoints:
                      pointsBalance: 120
                    createdAt: '2026-09-23T06:00:00+00:00'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      legalName:
                        type: string
                        example: 'Cliente Ejemplo S.A. de C.V.'
                      tradeName:
                        type: string
                        example: 'Cliente Ejemplo'
                      taxId:
                        type: string
                        example: 0614-260290-101-1
                      nrc:
                        type: string
                        example: 123456-7
                      economicActivity:
                        type: string
                        example: 'Venta de servicios'
                      address:
                        type: string
                        example: 'Colonia Centro, San Salvador'
                      municipality:
                        type: string
                        example: 'San Salvador'
                      department:
                        type: string
                        example: 'San Salvador'
                      phone:
                        type: string
                        example: 7000-0000
                      email:
                        type: string
                        example: cliente@example.com
                      status:
                        type: string
                        example: active
                      visitFrequency:
                        type: object
                        properties:
                          value:
                            type: integer
                            example: 30
                          unit:
                            type: string
                            example: days
                      currentPlan:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          planCode:
                            type: string
                            example: BASICO
                          planName:
                            type: string
                            example: 'Plan Básico'
                      wallet:
                        type: object
                        properties:
                          cashBalance:
                            type: number
                            example: 250.5
                          reservedSubscriptionBalance:
                            type: integer
                            example: 0
                      loyaltyPoints:
                        type: object
                        properties:
                          pointsBalance:
                            type: integer
                            example: 120
                      createdAt:
                        type: string
                        example: '2026-09-23T06:00:00+00:00'
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No query results for model [App\Models\Customer]'
                properties:
                  message:
                    type: string
                    example: 'No query results for model [App\Models\Customer]'
      tags:
        - Clientes
    put:
      summary: 'Actualizar información del cliente.'
      operationId: actualizarInformacinDelCliente
      description: 'Actualiza los datos editables de un cliente existente.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    legalName: 'Cliente Actualizado S.A. de C.V.'
                    status: active
                    createdAt: '2026-09-23T06:00:00+00:00'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      legalName:
                        type: string
                        example: 'Cliente Actualizado S.A. de C.V.'
                      status:
                        type: string
                        example: active
                      createdAt:
                        type: string
                        example: '2026-09-23T06:00:00+00:00'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The phone has already been taken.'
                  errors:
                    phone:
                      - 'The phone has already been taken.'
                properties:
                  message:
                    type: string
                    example: 'The phone has already been taken.'
                  errors:
                    type: object
                    properties:
                      phone:
                        type: array
                        example:
                          - 'The phone has already been taken.'
                        items:
                          type: string
      tags:
        - Clientes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                legal_name:
                  type: string
                  description: 'Nombre legal del cliente.'
                  example: 'Cliente Actualizado S.A. de C.V.'
                trade_name:
                  type: string
                  description: 'Nombre comercial.'
                  example: 'Cliente Actualizado'
                  nullable: true
                tax_id:
                  type: string
                  description: 'NIT del cliente (único).'
                  example: 0614-260290-101-1
                  nullable: true
                nrc:
                  type: string
                  description: 'NRC del cliente (único).'
                  example: 123456-7
                  nullable: true
                economic_activity:
                  type: string
                  description: 'Actividad económica.'
                  example: 'Venta de servicios'
                  nullable: true
                address:
                  type: string
                  description: Dirección.
                  example: 'Colonia Centro, San Salvador'
                department:
                  type: string
                  description: Departamento.
                  example: 'San Salvador'
                  nullable: true
                municipality:
                  type: string
                  description: Municipio.
                  example: 'San Salvador'
                phone:
                  type: string
                  description: 'Teléfono (único).'
                  example: 7000-0000
                email:
                  type: string
                  description: 'Correo electrónico.'
                  example: cliente@example.com
                  nullable: true
                visit_frequency_value:
                  type: integer
                  description: 'Frecuencia de visita (valor numérico).'
                  example: 30
                  nullable: true
                visit_frequency_unit:
                  type: string
                  description: 'Unidad de frecuencia de visita.'
                  example: days
                  nullable: true
              required:
                - legal_name
                - address
                - municipality
                - phone
    delete:
      summary: 'Eliminar un cliente (soft delete).'
      operationId: eliminarUnClientesoftDelete
      description: 'Marca al cliente como eliminado. No se elimina físicamente de la base de datos.'
      parameters: []
      responses:
        204:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: ''
      tags:
        - Clientes
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the customer.'
        example: architecto
        required: true
        schema:
          type: string
      -
        in: path
        name: customer
        description: 'ID del cliente.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/customers/{customer}/status':
    patch:
      summary: 'Inactivar / cambiar estado de un cliente.'
      operationId: inactivarCambiarEstadoDeUnCliente
      description: 'Actualiza el estado de un cliente (activo o inactivo) mediante PATCH.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    legalName: 'Cliente Ejemplo S.A. de C.V.'
                    status: inactive
                    createdAt: '2026-09-23T06:00:00+00:00'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      legalName:
                        type: string
                        example: 'Cliente Ejemplo S.A. de C.V.'
                      status:
                        type: string
                        example: inactive
                      createdAt:
                        type: string
                        example: '2026-09-23T06:00:00+00:00'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The selected status is invalid.'
                  errors:
                    status:
                      - 'The selected status is invalid.'
                properties:
                  message:
                    type: string
                    example: 'The selected status is invalid.'
                  errors:
                    type: object
                    properties:
                      status:
                        type: array
                        example:
                          - 'The selected status is invalid.'
                        items:
                          type: string
      tags:
        - Clientes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: 'Nuevo estado del cliente.'
                  example: inactive
              required:
                - status
    parameters:
      -
        in: path
        name: customer
        description: 'ID del cliente.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/customers/{customer}/plan-history':
    get:
      summary: 'Obtener el historial de planes de un cliente.'
      operationId: obtenerElHistorialDePlanesDeUnCliente
      description: 'Devuelve los planes que ha tenido el cliente, ordenados por fecha de inicio (descendente).'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 2
                      customer_id: 1
                      plan_id: 2
                      start_date: '2026-10-01'
                      end_date: null
                      plan:
                        id: 2
                        plan_code: PREMIUM
                        plan_name: 'Plan Premium'
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 2
                        customer_id: 1
                        plan_id: 2
                        start_date: '2026-10-01'
                        end_date: null
                        plan:
                          id: 2
                          plan_code: PREMIUM
                          plan_name: 'Plan Premium'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 2
                        customer_id:
                          type: integer
                          example: 1
                        plan_id:
                          type: integer
                          example: 2
                        start_date:
                          type: string
                          example: '2026-10-01'
                        end_date:
                          type: string
                          example: null
                          nullable: true
                        plan:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 2
                            plan_code:
                              type: string
                              example: PREMIUM
                            plan_name:
                              type: string
                              example: 'Plan Premium'
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No query results for model [App\Models\Customer]'
                properties:
                  message:
                    type: string
                    example: 'No query results for model [App\Models\Customer]'
      tags:
        - Clientes
    parameters:
      -
        in: path
        name: customer
        description: 'ID del cliente.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/customers/{customer}/plan':
    post:
      summary: 'Cambiar el plan de suscripción de un cliente.'
      operationId: cambiarElPlanDeSuscripcinDeUnCliente
      description: 'Asigna un nuevo plan al cliente, cerrando el historial del plan anterior.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    legalName: 'Cliente Ejemplo S.A. de C.V.'
                    status: active
                    currentPlan:
                      id: 2
                      planCode: PREMIUM
                      planName: 'Plan Premium'
                    createdAt: '2026-09-23T06:00:00+00:00'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      legalName:
                        type: string
                        example: 'Cliente Ejemplo S.A. de C.V.'
                      status:
                        type: string
                        example: active
                      currentPlan:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 2
                          planCode:
                            type: string
                            example: PREMIUM
                          planName:
                            type: string
                            example: 'Plan Premium'
                      createdAt:
                        type: string
                        example: '2026-09-23T06:00:00+00:00'
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'El cliente ya tiene asignado este plan'
                properties:
                  message:
                    type: string
                    example: 'El cliente ya tiene asignado este plan'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The selected plan id is invalid.'
                  errors:
                    plan_id:
                      - 'The selected plan id is invalid.'
                properties:
                  message:
                    type: string
                    example: 'The selected plan id is invalid.'
                  errors:
                    type: object
                    properties:
                      plan_id:
                        type: array
                        example:
                          - 'The selected plan id is invalid.'
                        items:
                          type: string
      tags:
        - Clientes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_id:
                  type: integer
                  description: 'ID del plan de suscripción a asignar.'
                  example: 2
              required:
                - plan_id
    parameters:
      -
        in: path
        name: customer
        description: 'ID del cliente.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/subscription-plans:
