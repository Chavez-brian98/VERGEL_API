name: Cotizaciones
description: |-

  APIs para la gestión de cotizaciones, ítems de servicio/planta y cálculo automático de montos.
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/quotes
    metadata:
      custom: []
      groupName: Cotizaciones
      groupDescription: |-

        APIs para la gestión de cotizaciones, ítems de servicio/planta y cálculo automático de montos.
      subgroup: Escritura
      subgroupDescription: ''
      title: 'Registrar una nueva cotización.'
      description: |-
        El backend calcula el total de cada ítem (`quantity * unit_price`), el subtotal con descuento del plan,
        el IVA (13% de El Salvador cuando `includes_vat` es false) y los puntos de lealtad ganados.
        El empleado se toma del usuario autenticado.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      customer_id:
        custom: []
        name: customer_id
        description: 'ID del cliente asociado.'
        required: false
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      applied_plan_id:
        custom: []
        name: applied_plan_id
        description: 'ID del plan de suscripción aplicado.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      includes_vat:
        custom: []
        name: includes_vat
        description: 'Indica si los precios ya incluyen IVA. Default: false.'
        required: false
        example: false
        type: boolean
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      loyalty_points_used:
        custom: []
        name: loyalty_points_used
        description: 'Puntos de lealtad usados (solo si la cotización incluye un servicio).'
        required: false
        example: 0
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      status:
        custom: []
        name: status
        description: 'Estado inicial (`pending` o `paid`). Default: pending.'
        required: false
        example: pending
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      items:
        custom: []
        name: items
        description: 'Lista de ítems de la cotización.'
        required: true
        example:
          - []
        type: 'object[]'
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      'items[].item_type':
        custom: []
        name: 'items[].item_type'
        description: 'Tipo de ítem (`service` o `plant`).'
        required: true
        example: service
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      'items[].service_id':
        custom: []
        name: 'items[].service_id'
        description: 'ID del servicio cuando `item_type` es `service`.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      'items[].plant_id':
        custom: []
        name: 'items[].plant_id'
        description: 'ID de la planta cuando `item_type` es `plant`.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      'items[].quantity':
        custom: []
        name: 'items[].quantity'
        description: Cantidad.
        required: true
        example: 2.0
        type: number
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      'items[].unit_price':
        custom: []
        name: 'items[].unit_price'
        description: 'Precio unitario.'
        required: true
        example: 25.5
        type: number
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      customer_id: 1
      applied_plan_id: 1
      includes_vat: false
      loyalty_points_used: 0
      status: pending
      items:
        -
          item_type: service
          service_id: 1
          plant_id: 1
